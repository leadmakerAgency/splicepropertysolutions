name: Blog publish webhook

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"

permissions:
  contents: read
  deployments: read
  statuses: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm ci

      - name: Detect new published posts
        id: detect
        run: node scripts/detect-new-blog-posts.js
        env:
          SITE_URL: https://www.splicepropertysolutions.co.uk

      - name: Wait for Vercel production deploy
        if: steps.detect.outputs.has_posts == 'true'
        run: node scripts/wait-for-vercel-deployment.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          DEPLOY_ENVIRONMENT: Production
          DEPLOY_WAIT_TIMEOUT_MS: 600000
          DEPLOY_WAIT_POLL_INTERVAL_MS: 10000

      - name: Notify Leadmaker
        if: steps.detect.outputs.has_posts == 'true'
        run: node scripts/send-blog-webhook.js
        env:
          LEADMAKER_BLOG_WEBHOOK_URL: ${{ secrets.LEADMAKER_BLOG_WEBHOOK_URL }}
          POSTS_FILE: ${{ steps.detect.outputs.posts_file }}
          COMMIT_SHA: ${{ github.sha }}
